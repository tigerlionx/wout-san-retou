<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wout San Retou: the building in 3D</title>
<style>
  :root { --bg:#0e1116; --panel:rgba(16,20,27,.88); --ink:#e8ecf2; --mute:#98a2b3; --line:#2a323f; --acc:#e0b020; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 system-ui,-apple-system,Segoe UI,sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  #ui { position:fixed; left:12px; top:12px; bottom:12px; width:262px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; overflow:auto; backdrop-filter:blur(8px); }
  #ui h1 { font-size:14px; margin:0 0 2px; letter-spacing:.02em; }
  #ui small { color:var(--mute); display:block; margin-bottom:10px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--mute); margin:14px 0 6px; font-weight:600; }
  button { font:inherit; color:var(--ink); background:#1b222d; border:1px solid var(--line); border-radius:7px; padding:5px 8px; cursor:pointer; }
  button:hover { border-color:#4a5568; } button.on { background:#2b3a52; border-color:#5b7fb5; }
  .row { display:flex; flex-wrap:wrap; gap:5px; }
  #views { display:flex; flex-direction:column; gap:4px; max-height:320px; overflow:auto; } #views button { text-align:left; }
  label { display:flex; justify-content:space-between; align-items:center; gap:8px; color:var(--mute); margin:4px 0; }
  input[type=range] { width:140px; }
  #hud { position:fixed; right:12px; top:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; color:var(--mute); max-width:300px; }
  #hud b { color:var(--ink); } #fps { color:var(--acc); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); z-index:10; font-size:15px; color:var(--mute); }
  body.walk #hud .orb { display:none; } body:not(.walk) #hud .wlk { display:none; }
  @media (max-width:720px){ #ui { width:auto; right:12px; bottom:auto; max-height:46vh; } #hud { display:none; } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="loading"><div>Building the estate...<br><small id="status"></small></div></div>
<div id="ui">
  <h1>Wout San Retou: the building</h1>
  <small>Landscape and 7 levels, from the OURCAD drawing. Fictional place.</small>
  <h2>Mode</h2>
  <div class="row"><button data-mode="orbit" class="on">Orbit</button><button data-mode="walk">Walk (F)</button></div>
  <h2>Time</h2>
  <div class="row"><button data-mood="day">Day</button><button data-mood="dusk" class="on">Dusk</button><button data-mood="night">Night</button></div>
  <h2>Views</h2>
  <div id="views"></div>
  <h2>Levels</h2>
  <div class="row">
    <button data-level="SITE" class="on">Landscape</button><button data-level="GF-A" class="on">L2 Maze</button><button data-level="GF-B" class="on">L3 Party</button>
    <button data-level="F1" class="on">L4 1st</button><button data-level="F2" class="on">L5 2nd</button><button data-level="F3" class="on">L6 Nwit</button><button data-level="ROOF" class="on">L7 Roof</button>
  </div>
  <label>Section cut <input id="cut" type="range" min="0" max="24" step="0.2" value="24"></label>
  <label>Exploded <input id="explode" type="range" min="0" max="14" step="0.5" value="0"></label>
  <label>Secret panels (red) <input id="secrets" type="checkbox" checked></label>
  <div class="row" style="margin-top:8px"><button id="onlyup">Reset view</button><button id="export">Export GLB</button></div>
  <small id="status2" style="margin-top:10px"></small>
</div>
<div id="hud">
  <div class="orb"><b>Orbit</b>: drag = turn, wheel = zoom, right-drag = pan.</div>
  <div class="wlk"><b>Walk</b>: WASD move, Shift run, Space jump, drag or mouse = look, F = back to orbit.</div>
  <div><span id="fps"></span></div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
